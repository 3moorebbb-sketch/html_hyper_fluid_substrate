<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Fluid Quantum Substrate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #e5e5e5;
            overflow: hidden; 
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', monospace;
            touch-action: none; 
            user-select: none;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)) contrast(1.2) brightness(1.2);
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }
        .glass-panel {
            background: rgba(5, 5, 10, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            pointer-events: auto; 
            transition: all 0.3s ease;
        }
        .interactive-btn {
            pointer-events: auto;
            cursor: pointer;
        }
        .interactive-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 20px currentColor;
        }
        .hud-value {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            text-shadow: 0 0 15px currentColor;
        }
        #scroll-track {
            width: 4px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        #scroll-thumb {
            width: 100%;
            background: currentColor;
            position: absolute;
            top: 0;
            border-radius: 2px;
            transition: top 0.1s ease, height 0.1s ease;
        }
    </style>
</head>
<body>
    <canvas id="substrateCanvas"></canvas>

    <div id="ui-layer">
        <header class="flex justify-between items-start gap-4">
            <div class="glass-panel p-5 max-w-sm shadow-2xl transition-colors duration-300" id="hud-primary">
                <h1 class="font-bold text-lg tracking-widest uppercase mb-1">Hyper-Fluid Substrate</h1>
                <p class="text-xs text-gray-400 leading-relaxed">
                    Scroll/Swipe to warp topology. Drag to inject thermal energy and shift the wavelength.
                </p>
                <div class="mt-4 flex items-center gap-3">
                    <div id="scroll-track">
                        <div id="scroll-thumb" style="height: 10%;"></div>
                    </div>
                    <div class="text-[10px] text-gray-500 uppercase tracking-widest">
                        Z-Depth Topology<br>
                        <span id="stat-depth" class="text-sm hud-value">0.00</span>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-5 min-w-[220px] shadow-2xl text-right transition-colors duration-300" id="hud-secondary">
                <h2 class="text-[10px] text-gray-500 uppercase tracking-widest mb-3 border-b border-gray-800 pb-1">Quantum State</h2>
                <div class="flex justify-between mb-1 items-end">
                    <span class="text-xs text-gray-400">Wavelength</span>
                    <span id="stat-wave" class="text-sm hud-value">450 nm</span>
                </div>
                <div class="flex justify-between mb-1 items-end">
                    <span class="text-xs text-gray-400">Energy Level</span>
                    <span id="stat-energy" class="text-sm hud-value">0.0%</span>
                </div>
                <div class="flex justify-between mt-3 items-end">
                    <span class="text-[10px] uppercase tracking-widest">Active Links</span>
                    <span id="stat-links" class="text-lg hud-value">0</span>
                </div>
            </div>
        </header>

        <footer class="flex justify-center pb-4">
            <button id="btn-reset" class="glass-panel interactive-btn px-8 py-3 text-xs uppercase tracking-widest font-bold transition-colors duration-300">
                Detonate & Reset Substrate
            </button>
        </footer>
    </div>

<script>
(() => {
    const canvas = document.getElementById('substrateCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); 

    const statDepth = document.getElementById('stat-depth');
    const statWave = document.getElementById('stat-wave');
    const statEnergy = document.getElementById('stat-energy');
    const statLinks = document.getElementById('stat-links');
    const scrollThumb = document.getElementById('scroll-thumb');
    const hudPrimary = document.getElementById('hud-primary');
    const hudSecondary = document.getElementById('hud-secondary');
    const btnReset = document.getElementById('btn-reset');

    let width, height;
    let nodes = [];
    const NUM_NODES = 800; 
    
    // VARIABLES RESTORED HERE:
    let globalEnergy = 0.0; 
    let virtualScrollDepth = 0.0; 
    
    let isDrawing = false;
    let mouseX = -1000, mouseY = -1000;
    let lastTouchY = 0;
    let frame = 0;

    const GRID_SIZE = 80; 
    let cols, rows;
    let grid = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        cols = Math.ceil(width / GRID_SIZE);
        rows = Math.ceil(height / GRID_SIZE);
        grid = new Array(cols * rows);
        for(let i = 0; i < grid.length; i++) {
            grid[i] = [];
        }
    }
    window.addEventListener('resize', resize);
    resize();

    class Node {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 4; 
            this.vy = (Math.random() - 0.5) * 4;
            this.basePhase = Math.random() * Math.PI * 2;
            this.links = 0; // Track connections per frame to prevent lag
        }

        update() {
            let energyMultiplier = 1.0 + (globalEnergy * 3.0);
            this.links = 0; // Reset connection count each frame

            if (isDrawing) {
                let dx = mouseX - this.x;
                let dy = mouseY - this.y;
                let dist = Math.hypot(dx, dy);
                
                if (dist < 500) {
                    let linearDist = Math.max(15, dist);
                    
                    // Pull in, but violently push away if too close (prevents the "ball" clump)
                    let attractiveForce = 2500 / (linearDist * linearDist + 50); 
                    let repulsiveForce = dist < 40 ? (40 - dist) * 0.15 : 0; 
                    
                    let effectiveForce = attractiveForce - repulsiveForce;
                    
                    this.vx += (dx / dist) * effectiveForce;
                    this.vy += (dy / dist) * effectiveForce;
                    
                    let swirl = attractiveForce * (1.0 + virtualScrollDepth * 2) * 0.8;
                    this.vx += (dy / dist) * swirl;
                    this.vy -= (dx / dist) * swirl;
                }
            } else {
                // Let them roam freely across the entire screen
                let baseDriftSpeed = 0.2 * energyMultiplier; 
                this.vx += (Math.random() - 0.5) * baseDriftSpeed;
                this.vy += (Math.random() - 0.5) * baseDriftSpeed;
            }

            let friction = 0.95 + (globalEnergy * 0.03); 
            this.vx *= friction;
            this.vy *= friction;

            const speed = Math.hypot(this.vx, this.vy);
            const MAX_PHYSICS_SPEED = 20 + globalEnergy * 15;
            if (speed > MAX_PHYSICS_SPEED) {
                this.vx = (this.vx / speed) * MAX_PHYSICS_SPEED;
                this.vy = (this.vy / speed) * MAX_PHYSICS_SPEED;
            }

            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0) this.x += width;
            if (this.x > width) this.x -= width;
            if (this.y < 0) this.y += height;
            if (this.y > height) this.y -= height;
            
            let cx = ~~ (this.x / GRID_SIZE);
            let cy = ~~ (this.y / GRID_SIZE);
            if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
                grid[cy * cols + cx].push(this);
            }
        }

        draw(hue) {
            let speed = Math.hypot(this.vx, this.vy);
            let size = 1.0 + (globalEnergy * 2.5) + (speed * 0.05);

            ctx.moveTo(this.x + size, this.y);
            ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
        }
    }

    function drawWarpedLine(x1, y1, x2, y2, depthPhase) {
        let dx = x2 - x1;
        let dy = y2 - y1;
        let dist = Math.hypot(dx, dy);

        if (virtualScrollDepth < 0.05 || dist < 20) {
            ctx.lineTo(x2, y2); 
            return;
        }
        
        let mx = x1 + dx * 0.5;
        let my = y1 + dy * 0.5;
        let effectiveDist = Math.min(dist, 50);

        let foldAngle = Math.atan2(dy, dx) + (Math.PI * virtualScrollDepth * Math.sin(depthPhase));
        let foldDist = effectiveDist * virtualScrollDepth * 0.8;

        let fx = mx + Math.cos(foldAngle) * foldDist;
        let fy = my + Math.sin(foldAngle) * foldDist;

        ctx.bezierCurveTo(mx, my, fx, fy, x2, y2);
    }

    for (let i = 0; i < NUM_NODES; i++) nodes.push(new Node());

    function animate() {
        frame++;

        let currentHue = 180 + (globalEnergy * 160);
        let currentColor = `hsl(${currentHue}, 100%, 60%)`;
        let uiColor = `hsla(${currentHue}, 100%, 60%, 0.3)`;

        globalEnergy = Math.max(0, globalEnergy - 0.005);

        // Clear Background
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgba(0, 0, 0, ${0.15 - (globalEnergy * 0.05)})`; 
        ctx.fillRect(0, 0, width, height);

        ctx.globalCompositeOperation = 'lighter';

        for(let i = 0; i < grid.length; i++) {
            grid[i].length = 0;
        }

        for (let i = 0; i < NUM_NODES; i++) {
            nodes[i].update();
        }

        let linksThisFrame = 0;
        const MAX_DIST_SQ = GRID_SIZE * GRID_SIZE; 

        // --- THE GPU BATCH RENDERING FIX ---
        // Instead of issuing 5,000 stroke() commands, we issue exactly ONE.
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${currentHue}, 100%, ${50 + globalEnergy*30}%, ${0.2 + globalEnergy * 0.4})`;
        ctx.lineWidth = 0.5 + (globalEnergy * 1.5);
        
        let isHyperCriticalState = globalEnergy > 0.85;

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let cellIdx = y * cols + x;
                let cellNodes = grid[cellIdx];
                if (cellNodes.length === 0) continue;

                let neighbors = [];
                for (let ny = -1; ny <= 1; ny++) {
                    for (let nx = -1; nx <= 1; nx++) {
                        let nc = x + nx;
                        let nr = y + ny;
                        if (nc >= 0 && nc < cols && nr >= 0 && nr < rows) {
                            neighbors.push(nr * cols + nc);
                        }
                    }
                }

                for (let i = 0; i < cellNodes.length; i++) {
                    let n1 = cellNodes[i];
                    if (n1.links > 5) continue; // Capping connections prevents explosion lag

                    for (let nIdx of neighbors) {
                        let neighborNodes = grid[nIdx];
                        for (let k = 0; k < neighborNodes.length; k++) {
                            let n2 = neighborNodes[k];
                            
                            if (n1 === n2 || n1.x > n2.x || n2.links > 5) continue;

                            let dx = n1.x - n2.x;
                            let dy = n1.y - n2.y;
                            let distSq = dx*dx + dy*dy;

                            if (distSq < MAX_DIST_SQ) {
                                let dist = Math.sqrt(distSq);

                                // Spacing Fix: Micro-repulsion so they fill the screen instead of clustering
                                if (dist < 25) {
                                    let rep = (25 - dist) * 0.02;
                                    n1.vx -= dx * rep; n1.vy -= dy * rep;
                                    n2.vx += dx * rep; n2.vy += dy * rep;
                                }

                                n1.links++;
                                n2.links++;
                                linksThisFrame++;
                                
                                ctx.moveTo(n1.x, n1.y);
                                
                                if (isHyperCriticalState || virtualScrollDepth < 0.05 || dist < 20) {
                                    ctx.lineTo(n2.x, n2.y);
                                } else {
                                    drawWarpedLine(n1.x, n1.y, n2.x, n2.y, n1.basePhase + frame * 0.05);
                                }
                            }
                        }
                    }
                }
            }
        }
        ctx.stroke(); // Draw ALL lines simultaneously 

        // Batch render nodes
        ctx.beginPath();
        ctx.fillStyle = `hsl(${currentHue}, 100%, ${60 + (globalEnergy*40)}%)`;
        for (let i = 0; i < NUM_NODES; i++) {
            nodes[i].draw(currentHue);
        }
        ctx.fill();

        // Interaction Core
        if (isDrawing) {
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 15 + (globalEnergy * 20), 0, Math.PI * 2);
            ctx.fillStyle = "#FFF";
            ctx.shadowBlur = 50;
            ctx.shadowColor = currentColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Update UI
        if (frame % 3 === 0) {
            statEnergy.innerText = (globalEnergy * 100).toFixed(1) + "%";
            statWave.innerText = Math.floor(450 + (globalEnergy * 250)) + " nm";
            statDepth.innerText = virtualScrollDepth.toFixed(2);
            statLinks.innerText = linksThisFrame.toLocaleString();
            
            scrollThumb.style.height = Math.max(5, virtualScrollDepth * 100) + "%";
            scrollThumb.style.top = (virtualScrollDepth * (100 - parseFloat(scrollThumb.style.height))) + "%";

            document.documentElement.style.color = currentColor;
            hudPrimary.style.borderColor = uiColor;
            hudSecondary.style.borderColor = uiColor;
            btnReset.style.borderColor = uiColor;
            btnReset.style.color = currentColor;
            scrollThumb.style.backgroundColor = currentColor;
        }

        requestAnimationFrame(animate);
    }

    function injectEnergy(amount) {
        globalEnergy = Math.min(1.0, globalEnergy + amount);
    }

    function setMousePos(x, y) {
        mouseX = x;
        mouseY = y;
        injectEnergy(0.02); 
    }

    window.addEventListener('mousedown', (e) => {
        if (e.target.tagName !== 'BUTTON') {
            isDrawing = true;
            setMousePos(e.clientX, e.clientY);
            injectEnergy(0.1);
        }
    });
    window.addEventListener('mousemove', (e) => {
        if (isDrawing) setMousePos(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => isDrawing = false);

    window.addEventListener('wheel', (e) => {
        virtualScrollDepth += e.deltaY * 0.001;
        virtualScrollDepth = Math.max(0, Math.min(1.0, virtualScrollDepth));
        injectEnergy(0.05); 
    });

    window.addEventListener('touchstart', (e) => {
        if (e.target.tagName !== 'BUTTON') {
            isDrawing = true;
            lastTouchY = e.touches[0].clientY;
            setMousePos(e.touches[0].clientX, e.touches[0].clientY);
            injectEnergy(0.1);
        }
    }, { passive: false });
    
    window.addEventListener('touchmove', (e) => {
        if (isDrawing) {
            setMousePos(e.touches[0].clientX, e.touches[0].clientY);
            let currentTouchY = e.touches[0].clientY;
            let deltaY = lastTouchY - currentTouchY;
            virtualScrollDepth += deltaY * 0.002;
            virtualScrollDepth = Math.max(0, Math.min(1.0, virtualScrollDepth));
            lastTouchY = currentTouchY;
            e.preventDefault(); 
        }
    }, { passive: false });
    window.addEventListener('touchend', () => isDrawing = false);

    btnReset.addEventListener('click', () => {
        globalEnergy = 0.0;
        virtualScrollDepth = 0.0;
        
        for (let n of nodes) {
            let dx = width/2 - n.x;
            let dy = height/2 - n.y;
            let dist = Math.hypot(dx, dy);
            let force = -2000 / (dist + 10); 
            n.vx += (dx / dist) * force;
            n.vy += (dy / dist) * force;
        }
    });

    animate();
})();
</script>
</body>
</html>
